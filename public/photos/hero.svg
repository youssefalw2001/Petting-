<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Warm tonal placeholder">
  <defs>
    <radialGradient id="v-hero" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5A4A3C" stop-opacity="0.16"/>
    </radialGradient>
    <filter id="b-hero" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="85"/>
    </filter>
    <filter id="g-hero">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#E8DCCF"/>

  <!-- soft out-of-focus forms, like light falling across a room -->
  <g filter="url(#b-hero)" opacity="0.95">
    <ellipse cx="496" cy="670" rx="704" ry="360" fill="#D9C7B5"/>
    <ellipse cx="1168" cy="290" rx="544" ry="280" fill="#C9AE99" opacity="0.55"/>
    <ellipse cx="880" cy="810" rx="480" ry="200" fill="#C9AE99" opacity="0.4"/>
  </g>

  <rect width="1600" height="1000" fill="url(#v-hero)"/>
  <rect width="1600" height="1000" filter="url(#g-hero)" opacity="0.11" style="mix-blend-mode:multiply"/>
</svg>
