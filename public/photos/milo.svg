<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Warm tonal placeholder">
  <defs>
    <radialGradient id="v-milo" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5A4A3C" stop-opacity="0.16"/>
    </radialGradient>
    <filter id="b-milo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="85"/>
    </filter>
    <filter id="g-milo">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="#E4D9CE"/>

  <!-- soft out-of-focus forms, like light falling across a room -->
  <g filter="url(#b-milo)" opacity="0.95">
    <ellipse cx="310" cy="838" rx="440" ry="450" fill="#D2C1B0"/>
    <ellipse cx="730" cy="362" rx="340" ry="350" fill="#B9A38F" opacity="0.55"/>
    <ellipse cx="550" cy="1013" rx="300" ry="250" fill="#B9A38F" opacity="0.4"/>
  </g>

  <rect width="1000" height="1250" fill="url(#v-milo)"/>
  <rect width="1000" height="1250" filter="url(#g-milo)" opacity="0.11" style="mix-blend-mode:multiply"/>
</svg>
