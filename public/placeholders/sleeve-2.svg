<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Placeholder sleeve artwork">
  <defs>
    <filter id="g2">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <clipPath id="c2"><rect width="800" height="800" /></clipPath>
  </defs>

  <g clip-path="url(#c2)">
    <rect width="800" height="800" fill="#DFDCCB" />

    <!-- window light: a warm rectangle of afternoon sun on the floor -->
    <g opacity="0.9">
      <path d="M188 96 L612 96 L688 704 L112 704 Z" fill="#D8A55F" opacity="0.32" />
      <path d="M282 96 L518 96 L556 704 L244 704 Z" fill="#C4693D" opacity="0.2" />
    </g>

    <!-- window frame -->
    <g stroke="#7D8A6F" stroke-width="9" opacity="0.7">
      <line x1="400" y1="96" x2="400" y2="704" />
      <line x1="150" y1="400" x2="650" y2="400" />
    </g>

    <!-- sun disc, high -->
    <circle cx="400" cy="256" r="104" fill="#B8945F" opacity="0.55" />
    <circle cx="400" cy="256" r="104" fill="none" stroke="#7D8A6F" stroke-width="4" opacity="0.6" />

    <rect width="800" height="800" filter="url(#g2)" opacity="0.14" style="mix-blend-mode:multiply" />
  </g>
</svg>
