<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Placeholder sleeve artwork">
  <defs>
    <filter id="g1">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <clipPath id="c1"><rect width="800" height="800" /></clipPath>
  </defs>

  <g clip-path="url(#c1)">
    <rect width="800" height="800" fill="#E8DDCB" />

    <!-- low sun -->
    <circle cx="400" cy="500" r="196" fill="#C4693D" />
    <circle cx="400" cy="500" r="196" fill="#A5522C" opacity="0.28" />

    <!-- rays -->
    <g stroke="#C4693D" stroke-width="7" stroke-linecap="round" opacity="0.5">
      <line x1="400" y1="236" x2="400" y2="150" />
      <line x1="243" y1="291" x2="187" y2="230" />
      <line x1="557" y1="291" x2="613" y2="230" />
      <line x1="150" y1="430" x2="66" y2="430" />
      <line x1="650" y1="430" x2="734" y2="430" />
    </g>

    <!-- horizon bands -->
    <rect y="612" width="800" height="10" fill="#1F1B18" opacity="0.16" />
    <rect y="648" width="800" height="6" fill="#1F1B18" opacity="0.1" />
    <rect y="676" width="800" height="4" fill="#1F1B18" opacity="0.07" />

    <!-- grain -->
    <rect width="800" height="800" filter="url(#g1)" opacity="0.14" style="mix-blend-mode:multiply" />
  </g>
</svg>
