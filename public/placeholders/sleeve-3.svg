<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Placeholder sleeve artwork">
  <defs>
    <filter id="g3">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <clipPath id="c3"><rect width="800" height="800" /></clipPath>
  </defs>

  <g clip-path="url(#c3)">
    <rect width="800" height="800" fill="#E4DACB" />

    <!-- concentric sun, full-bleed rings -->
    <g fill="none" stroke="#B8945F" stroke-width="16">
      <circle cx="400" cy="400" r="352" opacity="0.22" />
      <circle cx="400" cy="400" r="278" opacity="0.3" />
      <circle cx="400" cy="400" r="204" opacity="0.4" />
    </g>
    <circle cx="400" cy="400" r="132" fill="#C4693D" />
    <circle cx="400" cy="400" r="132" fill="#1F1B18" opacity="0.08" />

    <!-- 16 rays -->
    <g stroke="#1F1B18" stroke-width="5" stroke-linecap="round" opacity="0.24">
      <line x1="400" y1="176" x2="400" y2="112" />
      <line x1="558" y1="242" x2="604" y2="196" />
      <line x1="624" y1="400" x2="688" y2="400" />
      <line x1="558" y1="558" x2="604" y2="604" />
      <line x1="400" y1="624" x2="400" y2="688" />
      <line x1="242" y1="558" x2="196" y2="604" />
      <line x1="176" y1="400" x2="112" y2="400" />
      <line x1="242" y1="242" x2="196" y2="196" />
    </g>

    <rect width="800" height="800" filter="url(#g3)" opacity="0.14" style="mix-blend-mode:multiply" />
  </g>
</svg>
