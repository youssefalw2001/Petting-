<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Placeholder sleeve artwork">
  <defs>
    <filter id="g3">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <clipPath id="c3"><rect width="800" height="800" /></clipPath>
  </defs>
  <g clip-path="url(#c3)">
    <rect width="800" height="800" fill="#E4DACB" />

    <!-- record grooves, full bleed -->
    <g fill="none" stroke="#B8945F">
      <circle cx="400" cy="400" r="352" stroke-width="16" opacity="0.2" />
      <circle cx="400" cy="400" r="286" stroke-width="16" opacity="0.26" />
      <circle cx="400" cy="400" r="220" stroke-width="16" opacity="0.34" />
      <circle cx="400" cy="400" r="154" stroke-width="16" opacity="0.42" />
    </g>

    <!-- centre label -->
    <circle cx="400" cy="400" r="104" fill="#C4693D" />

    <!-- tail knocked out of the label -->
    <g transform="translate(400 400) scale(3.6) translate(-24 -24)">
      <path d="M15 42C15 30 15 18 21 11.5 26 6 33.5 8 33.5 15 33.5 20.5 28 22.5 25 19.5"
            fill="none" stroke="#E4DACB" stroke-width="5" stroke-linecap="round" />
    </g>

    <rect width="800" height="800" filter="url(#g3)" opacity="0.14" style="mix-blend-mode:multiply" />
  </g>
</svg>
